[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-transit-lab"
version = "0.1.0"
description = "Hackathon-ready exoplanet transit detection pipeline and dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
science = [
  "astropy>=6.1,<8",
  "lightkurve>=2.5,<3",
  "scikit-learn>=1.5,<2",
]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

